name: Deploy Web to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build pure Python wheel
        run: python -m build --wheel --outdir web/

      - name: Copy static data files
        run: |
          mkdir -p web/data
          cp data/*.json web/data/

      - name: Copy demo save
        run: cp samples/sample_save.sav web/sample_save.sav

      - name: Copy icons
        run: |
          mkdir -p web/icons
          cp -r companion/static/icons/* web/icons/

      - name: Copy fonts
        run: |
          mkdir -p web/fonts
          cp -r companion/static/fonts/* web/fonts/

      - name: Create .nojekyll
        run: touch web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
