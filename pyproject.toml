[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fom-gift-planner"
version = "1.2.0"
description = "Fields of Mistria Daily Gift Bag Planner & Rankings Analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Minh" }
]
keywords = ["fields-of-mistria", "gift-planner", "game-tools"]
dependencies = []

[project.optional-dependencies]
companion = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "watchdog>=4.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
fom-companion = "companion.server:launch"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["fom_planner", "companion"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
